# Публикация .cfe как ассета Gitea Release.
# Плейсхолдеры @...@ подставляет обработка «Генератор шаблонов публикации».
# Требуется secret GITEA_TOKEN с правом записи релизов.

name: Publish package artifact

on:
  push:
    tags:
      - "*"

env:
  PACKAGE_NAME: @PACKAGE_NAME@
  CFE_NAME: @CFE_NAME@
  CFE_PATH: @CFE_PATH@
  GITEA_API_URL: https://gitea.example.com/api/v1
  GITEA_REPOSITORY: owner/repository

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CFE
        run: |
          # TODO: заменить на команду сборки .cfe вашего проекта.
          test -f "${CFE_PATH}"

      - name: Create Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          release_id=$(curl --fail --silent \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"tag_name\":\"${TAG_NAME}\",\"name\":\"${TAG_NAME}\"}" \
            "${GITEA_API_URL}/repos/${GITEA_REPOSITORY}/releases" \
            | jq -r '.id')

          curl --fail \
            --header "Authorization: token ${GITEA_TOKEN}" \
            --form "attachment=@${CFE_PATH}" \
            "${GITEA_API_URL}/repos/${GITEA_REPOSITORY}/releases/${release_id}/assets?name=${CFE_NAME}"
