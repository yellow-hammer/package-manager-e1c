# Публикация .cfe в GitLab Generic Package Registry.
# Плейсхолдеры @...@ подставляет обработка «Генератор шаблонов публикации».

stages:
  - build
  - package

variables:
  PACKAGE_NAME: "@PACKAGE_NAME@"
  CFE_NAME: "@CFE_NAME@"
  CFE_PATH: "@CFE_PATH@"

build:cfe:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # TODO: заменить на команду сборки .cfe вашего проекта.
    - test -f "${CFE_PATH}"
  artifacts:
    paths:
      - "${CFE_PATH}"
    expire_in: 1 day

package:gitlab:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build:cfe
      artifacts: true
  script:
    - >
      curl --fail
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file "${CFE_PATH}"
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${CFE_NAME}"
