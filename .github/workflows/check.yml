name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Проверкам нужно читать репозиторий и образ платформы.
permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Проверки на ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Платформа, OneScript и vanessa-runner 2 из образа yellow-hammer/1c-nest.
    # Шаги идут от root, поэтому vrunner тоже остаётся под root.
    container:
      image: ghcr.io/yellow-hammer/1c-nest/vrunner:${{ matrix.platform }}-vrunner2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        ONEC_NEST_AS_OWNER: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Исходники выгружены в формате 2.20 — его читает платформа
          # с 8.3.27. Режим совместимости расширения по-прежнему 8.3.23:
          # собранный .cfe должен применяться и к более старым базам.
          - id: min
            title: 8.3 минимальная
            platform: 8.3.27.1508
            build: true
          - id: latest
            title: 8.5 последняя
            platform: '8.5.1'
            build: false

    steps:
      - uses: actions/checkout@v4

      # Версию платформы задаёт образ: в env.json она зафиксирована
      # для локальной работы и матрице не подходит.
      # Безопасный режим у расширений снимается сразу: иначе YAxUnit
      # не сможет писать отчет на диск.
      - name: ИБ и расширения
        run: |
          set -euo pipefail
          vrunner init-dev --src src/cf --settings env.json --ibcmd --v8version "$ONEC_VERSION"
          vrunner compileext src/cfe/package-manager package-manager --updatedb --settings env.json --ibcmd --v8version "$ONEC_VERSION"
          vrunner compileext tests/cfe/yaxunit YAXUNIT --updatedb --settings env.json --ibcmd --v8version "$ONEC_VERSION"
          vrunner compileext tests/cfe/yaxunit-tests YAXUNIT-tests --updatedb --settings env.json --ibcmd --v8version "$ONEC_VERSION"
          for ext in package-manager YAXUNIT YAXUNIT-tests; do
            ibcmd infobase config extension update --db-path="$GITHUB_WORKSPACE/build/ib" \
              --name="$ext" --safe-mode=no --unsafe-action-protection=no
          done

      # Клиентской лицензии на раннере нет. Файловый запуск (/F) без нее
      # не стартует: клиент проверяет цифровую подпись конфигурации и выходит.
      # Через автономный сервер (ibsrv + /WS) тонкий клиент работает - так
      # гоняет тесты CI самого YAxUnit. Сервер живет только внутри шага:
      # дальше ibcmd потребуется исключительная блокировка базы.
      - name: YAxUnit
        run: |
          set -euo pipefail
          mkdir -p build/out/yaxunit
          ibsrv --db-path="$GITHUB_WORKSPACE/build/ib" --port=8314 --disable-direct-gate &
          IBSRV_PID=$!
          # Дождаться завершения обязательно: следующим шагам ibcmd нужна
          # исключительная блокировка базы.
          trap 'kill "$IBSRV_PID" 2>/dev/null || true; wait "$IBSRV_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:8314/ >/dev/null 2>&1 && break
            sleep 2
          done
          xvfb-run -a 1cv8c /WS http://127.0.0.1:8314 \
            /C"RunUnitTests=./tools/yaxunit.json" /Lru \
            /DisableStartupDialogs /DisableStartupMessages /DisableUnrecoverableErrorMessage \
            /Out build/out/yaxunit/client.log || true

      # YAxUnit возвращает ноль и тогда, когда тестовый модуль не смог
      # скомпилироваться и молча выпал из прогона. Поэтому отчет сверяется
      # со списком модулей на диске, а лог читается на ошибки загрузки.
      - name: Отчет YAxUnit
        run: |
          set -euo pipefail
          report=build/out/yaxunit/junit.xml
          result=build/out/yaxunit/result.txt
          log=build/out/yaxunit/log.txt
          if [ ! -f "$result" ] || [ ! -f "$report" ]; then
            echo "Отчет не создан - тесты не выполнялись"
            cat build/out/yaxunit/client.log 2>/dev/null || true
            exit 1
          fi
          if [ -f "$log" ] && grep -q "Ошибка инициализации" "$log"; then
            echo "Часть тестовых модулей не загрузилась:"
            grep -A 4 "Ошибка инициализации" "$log"
            exit 1
          fi
          missing=0
          for xml in tests/cfe/yaxunit-tests/CommonModules/*.xml; do
            module="$(basename "$xml" .xml)"
            if ! grep -q "name=\"$module " "$report"; then
              echo "Модуль $module не попал в отчет - его тесты не выполнялись"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          # В файле кода возврата BOM, поэтому берутся только цифры.
          code="$(grep -o '[0-9-]*' "$result" | head -1)"
          if [ "$code" != "0" ]; then
            echo "YAxUnit вернул код $code"
            exit 1
          fi
          echo "Наборы в отчете:"
          grep -o 'testsuite name="[^"]*" tests="[0-9]*"' "$report" || true

      # Синтакс-контроль Конфигуратором в CI невозможен: 1cv8 без лицензии
      # не работает. Метаданные проверяет ibcmd, синтаксис модулей в обоих
      # контекстах - компиляция при прогоне тестов выше. Полный контроль
      # (vrunner syntax-check) идет локально, где лицензия есть.
      - name: Проверка метаданных
        run: |
          set -euo pipefail
          ibcmd config check --db-path="$GITHUB_WORKSPACE/build/ib"
          ibcmd config check --db-path="$GITHUB_WORKSPACE/build/ib" --extension=package-manager
          ibcmd config check --db-path="$GITHUB_WORKSPACE/build/ib" --extension=YAXUNIT-tests

      - name: Собрать cfe
        if: matrix.build
        run: |
          set -euo pipefail
          mkdir -p build/out/cfe
          vrunner compileexttocfe --ibcmd --settings env.json --v8version "$ONEC_VERSION" \
            --src src/cfe/package-manager \
            --out build/out/cfe/package-manager.cfe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaxunit-${{ matrix.id }}
          path: build/out/yaxunit/

      - uses: actions/upload-artifact@v4
        if: matrix.build
        with:
          name: package
          path: build/out/cfe/package-manager.cfe
